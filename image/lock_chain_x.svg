<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Blue energy glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow_strong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Chain link gradient -->
    <linearGradient id="chainGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00eaff"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0044cc"/>
    </linearGradient>
    <linearGradient id="chainGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00eaff"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0044cc"/>
    </linearGradient>

    <!-- Shine gradient -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00eaff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background soft circle -->
  <circle cx="32" cy="32" r="28" fill="#001833" fill-opacity="0.5"/>

  <!-- ====== DIAGONAL \  chain (top-left to bottom-right) ====== -->
  <!-- Link 1 -->
  <rect x="7" y="7" width="14" height="8" rx="4" ry="4"
        fill="url(#chainGrad1)" filter="url(#glow)"
        transform="rotate(45 14 11)"/>
  <rect x="7" y="7" width="14" height="8" rx="4" ry="4"
        fill="none" stroke="url(#shineGrad)" stroke-width="1"
        transform="rotate(45 14 11)"/>

  <!-- Link 2 -->
  <rect x="20" y="20" width="14" height="8" rx="4" ry="4"
        fill="url(#chainGrad1)" filter="url(#glow)"
        transform="rotate(45 27 24)"/>
  <rect x="20" y="20" width="14" height="8" rx="4" ry="4"
        fill="none" stroke="url(#shineGrad)" stroke-width="1"
        transform="rotate(45 27 24)"/>

  <!-- Link 3 (center) -->
  <rect x="25" y="28" width="14" height="8" rx="4" ry="4"
        fill="url(#chainGrad1)" filter="url(#glow_strong)"
        transform="rotate(45 32 32)"/>
  <rect x="25" y="28" width="14" height="8" rx="4" ry="4"
        fill="none" stroke="url(#shineGrad)" stroke-width="1"
        transform="rotate(45 32 32)"/>

  <!-- Link 4 -->
  <rect x="30" y="36" width="14" height="8" rx="4" ry="4"
        fill="url(#chainGrad1)" filter="url(#glow)"
        transform="rotate(45 37 40)"/>
  <rect x="30" y="36" width="14" height="8" rx="4" ry="4"
        fill="none" stroke="url(#shineGrad)" stroke-width="1"
        transform="rotate(45 37 40)"/>

  <!-- Link 5 -->
  <rect x="43" y="49" width="14" height="8" rx="4" ry="4"
        fill="url(#chainGrad1)" filter="url(#glow)"
        transform="rotate(45 50 53)"/>
  <rect x="43" y="49" width="14" height="8" rx="4" ry="4"
        fill="none" stroke="url(#shineGrad)" stroke-width="1"
        transform="rotate(45 50 53)"/>

  <!-- ====== DIAGONAL /  chain (top-right to bottom-left) ====== -->
  <!-- Link A -->
  <rect x="43" y="7" width="14" height="8" rx="4" ry="4"
        fill="url(#chainGrad2)" filter="url(#glow)"
        transform="rotate(-45 50 11)"/>
  <rect x="43" y="7" width="14" height="8" rx="4" ry="4"
        fill="none" stroke="url(#shineGrad)" stroke-width="1"
        transform="rotate(-45 50 11)"/>

  <!-- Link B -->
  <rect x="30" y="20" width="14" height="8" rx="4" ry="4"
        fill="url(#chainGrad2)" filter="url(#glow)"
        transform="rotate(-45 37 24)"/>
  <rect x="30" y="20" width="14" height="8" rx="4" ry="4"
        fill="none" stroke="url(#shineGrad)" stroke-width="1"
        transform="rotate(-45 37 24)"/>

  <!-- Link C (center cross) -->
  <rect x="25" y="28" width="14" height="8" rx="4" ry="4"
        fill="url(#chainGrad2)" filter="url(#glow_strong)"
        transform="rotate(-45 32 32)"/>
  <rect x="25" y="28" width="14" height="8" rx="4" ry="4"
        fill="none" stroke="url(#shineGrad)" stroke-width="1"
        transform="rotate(-45 32 32)"/>

  <!-- Link D -->
  <rect x="20" y="36" width="14" height="8" rx="4" ry="4"
        fill="url(#chainGrad2)" filter="url(#glow)"
        transform="rotate(-45 27 40)"/>
  <rect x="20" y="36" width="14" height="8" rx="4" ry="4"
        fill="none" stroke="url(#shineGrad)" stroke-width="1"
        transform="rotate(-45 27 40)"/>

  <!-- Link E -->
  <rect x="7" y="49" width="14" height="8" rx="4" ry="4"
        fill="url(#chainGrad2)" filter="url(#glow)"
        transform="rotate(-45 14 53)"/>
  <rect x="7" y="49" width="14" height="8" rx="4" ry="4"
        fill="none" stroke="url(#shineGrad)" stroke-width="1"
        transform="rotate(-45 14 53)"/>

  <!-- Center energy burst -->
  <circle cx="32" cy="32" r="5" fill="#00eaff" fill-opacity="0.9" filter="url(#glow_strong)"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Corner sparks -->
  <circle cx="11" cy="11" r="2" fill="#00eaff" fill-opacity="0.8" filter="url(#glow)"/>
  <circle cx="53" cy="11" r="2" fill="#00eaff" fill-opacity="0.8" filter="url(#glow)"/>
  <circle cx="11" cy="53" r="2" fill="#00eaff" fill-opacity="0.8" filter="url(#glow)"/>
  <circle cx="53" cy="53" r="2" fill="#00eaff" fill-opacity="0.8" filter="url(#glow)"/>
</svg>
